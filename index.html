<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ランニングフォーム解析 プロ</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.log(e)));
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div class="container">
        <!-- 接続UI -->
        <div id="top-panel" class="panel connection-panel">
            <div class="connection-controls">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>コントロール</h2>
                    <div class="row">
                        <button id="theme-toggle" style="width: auto; padding: 2px 6px;">🌓</button>
                        <span id="statusText" class="status-badge">未接続</span>
                    </div>
                </div>
                <div class="button-row" style="margin-top: 4px;">
                    <button id="connectBtn">接続</button>
                    <button id="disconnectBtn">切断</button>
                    <button id="calibBtn">補正</button>
                    <button id="toggleBtn" style="background-color: var(--color-step);">開始</button>
                    <button id="recordBtn">記録</button>
                </div>
                <div id="log-line" class="log-line">PWA起動。「接続」後、「開始」で検知スタート。</div>
            </div>
            <!-- 生データパネル -->
            <div class="live-data-panel">
                <h2>生データ (9軸)</h2>
                <div id="live-data-container">待機中...</div>
            </div>
        </div>

        <!-- タブナビゲーション & ヘッダー表示切替 -->
        <div class="tabs-container">
            <div style="display: flex; gap: 2px; flex: 1;">
                <button id="tab-live" class="tab-btn active">生検知</button>
                <button id="tab-analysis" class="tab-btn">事後分析</button>
            </div>
            <button id="toggleTopPanelBtn" class="tertiary" style="width: auto; margin-bottom: 2px;">ヘッダー隠す ▲</button>
        </div>

        <!-- 可視化UI (生検知タブ) -->
        <div id="view-live" class="panel visualization-panel view-section active">
            <div class="vis-layout">
                <!-- 左側: 設定とリアルタイム指標 -->
                <div class="vis-left">
                    <div class="threshold-controls">
                        <div class="threshold-row"><label>判定/除外</label><div class="input-group"><input type="number" id="stepThresholdSlider" value="1.5" step="0.1"><input type="number" id="cooldownSlider" value="250" step="10"></div></div>
                        <div style="border-top: 1px solid var(--border-color); margin: 1px 0;"></div>
                        <div class="threshold-row"><label>体重/歩幅</label><div class="input-group"><input type="number" id="weightInput" value="72">kg <input type="number" id="strideInput" value="0.8" step="0.05">m</div></div>
                        <div class="threshold-row"><label>適正ピッチ</label><div class="input-group"><input type="number" id="pitchMin" value="170">-<input type="number" id="pitchMax" value="190"></div></div>
                        <div class="threshold-row"><label>適正前傾(°)</label><div class="input-group"><input type="number" id="tiltMin" value="5">-<input type="number" id="tiltMax" value="15"></div></div>
                        <div class="threshold-row"><label>上限(G/°)</label><div class="input-group">衝撃<input type="number" id="accMax" value="3.0" step="0.1"> ブレ<input type="number" id="dropMax" value="5"></div></div>
                    </div>
                    
                    <!-- ランニング中専用 視認性特化UI -->
                    <div class="running-metrics">
                        <div class="summary-metrics">
                            <div><span class="sm-label">歩数 / 距離</span><br><span id="stepCountValue" class="sm-val">0 / 0.00 km</span></div>
                            <div style="text-align: right;"><span class="sm-label">推定消費カロリー</span><br><span id="calorieValue" class="sm-val" style="color: var(--color-good);">0.0 kcal</span></div>
                        </div>
                        <div class="metric-grid">
                            <div class="metric-card" id="card-pitch">
                                <div class="mc-name">ピッチ</div>
                                <div class="mc-val" id="pitchValue">---</div>
                                <div class="mc-unit">spm</div>
                            </div>
                            <div class="metric-card" id="card-acc">
                                <div class="mc-name">着地衝撃</div>
                                <div class="mc-val" id="peakAccValue">0.00</div>
                                <div class="mc-unit">G</div>
                            </div>
                            <div class="metric-card" id="card-tilt">
                                <div class="mc-name">体幹前傾</div>
                                <div class="mc-val" id="tiltValue">0.0</div>
                                <div class="mc-unit">°</div>
                            </div>
                            <div class="metric-card" id="card-drop">
                                <div class="mc-name">左右ブレ</div>
                                <div class="mc-val" id="dropValue">0.0</div>
                                <div class="mc-unit">°</div>
                            </div>
                        </div>
                        <div id="advice-box" class="advice-box">開始ボタンを押してスタート</div>
                    </div>
                </div>
                <!-- 中央: グラフ -->
                <div class="vis-center">
                     <div class="vis-chart-container">
                        <div class="vis-title">ピッチ推移</div>
                        <div class="chart-row">
                            <div class="main-chart"><canvas id="pitch-chart"></canvas></div>
                            <div class="pie-wrapper"><canvas id="pitch-pie"></canvas><span class="pie-label">割合</span></div>
                        </div>
                     </div>
                     <div class="vis-chart-container">
                        <div class="vis-title">衝撃(G) - 前傾角(Deg)</div>
                        <div class="chart-row">
                            <div class="main-chart"><canvas id="distribution-chart"></canvas></div>
                            <div class="pie-wrapper"><canvas id="dist-pie"></canvas><span class="pie-label">割合</span></div>
                        </div>
                     </div>
                     <div class="vis-chart-container">
                        <div class="vis-title">左右ブレ推移</div>
                        <div class="chart-row">
                            <div class="main-chart"><canvas id="drop-chart"></canvas></div>
                            <div class="pie-wrapper"><canvas id="drop-pie"></canvas><span class="pie-label">割合</span></div>
                        </div>
                     </div>
                </div>
                <!-- 右側: 履歴 -->
                <div class="vis-right">
                    <div class="history-title-container">
                        <div class="history-title">履歴(直近100)</div>
                        <button id="clearHistoryBtn" class="tertiary" style="width: auto;">全削除</button>
                    </div>
                    <div class="history-list" id="history-list"></div>
                    <img src="logo.svg" alt="logo" class="panel-logo" onerror="this.style.display='none'">
                </div>
            </div>
        </div>

        <!-- 可視化UI (事後分析タブ) -->
        <div id="view-analysis" class="panel visualization-panel view-section">
            <div class="analysis-layout">
               <!-- メインコンテンツ(左側) -->
               <div class="analysis-main-content">
                   <div class="analysis-summary">
                       <div class="score-circle">
                           <span id="analysis-score">0</span>
                           <span class="score-unit">スコア</span>
                       </div>
                       <div class="analysis-pie-container">
                           <canvas id="analysis-pie-chart"></canvas>
                       </div>
                       <div class="analysis-text-area" id="analysis-stats">
                           <!-- JSからテーブル挿入 -->
                       </div>
                   </div>
                   
                   <div class="analysis-charts-grid">
                       <div id="cell-timeline" class="vis-chart-container analysis-chart-cell">
                           <div class="vis-title">ピッチ＆着地衝撃 推移</div>
                           <div class="vis-content-wrapper"><canvas id="analysis-timeline-chart"></canvas></div>
                       </div>
                       <div id="cell-tilt" class="vis-chart-container analysis-chart-cell">
                           <div class="vis-title">体幹前傾角 推移</div>
                           <div class="vis-content-wrapper"><canvas id="analysis-tilt-chart"></canvas></div>
                       </div>
                       <div id="cell-correlation" class="vis-chart-container analysis-chart-cell">
                           <div class="vis-title">ピッチと衝撃の相関 (回帰線付)</div>
                           <div class="vis-content-wrapper"><canvas id="analysis-correlation-chart"></canvas></div>
                       </div>
                       <div id="cell-balance" class="vis-chart-container analysis-chart-cell">
                           <div class="vis-title">平均ブレ幅 (バランス)</div>
                           <div class="vis-content-wrapper"><canvas id="analysis-balance-chart"></canvas></div>
                       </div>
                   </div>
               </div>
               
               <!-- 右側サイドバー -->
               <div class="analysis-sidebar">
                   <div id="analysis-text" class="analysis-text">データがありません。開始してください。</div>
               </div>
            </div>
        </div>
    </div>
    <script src="swing_logic.js"></script>
    <script src="app.js"></script>
</body>
</html>
